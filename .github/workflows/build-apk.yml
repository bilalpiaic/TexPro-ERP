name: Build downloadable APK

on:
  push:
    branches:
      - main
      - "cursor/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble sideload APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build installable APK
        run: gradle --no-daemon :app:copySideloadApk

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TexPro-ERP-apk
          path: dist/TexPro-ERP.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release APK
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="TexPro ERP ${TAG}"
            NOTES="Standalone Android APK for sideloading. Enable Install unknown apps, then open TexPro-ERP.apk on the phone."
          else
            TAG="sideload"
            TITLE="TexPro ERP sideload APK"
            NOTES="Latest standalone APK from a manual workflow run. Not a Google Play build. Enable Install unknown apps, then open TexPro-ERP.apk."
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/TexPro-ERP.apk --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" dist/TexPro-ERP.apk \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
